[project]
name = "risk-aware-quantum-kernel-credit"
version = "0.1.0"
description = "Risk-aware quantum-classical kernel experiments for cost-sensitive credit risk classification."
authors = [
    {name = "jay",email = "the20027@naver.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "shap (>=0.51.0,<0.52.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)",
    "qiskit (>=2.4.1,<3.0.0)",
    "qiskit-algorithms (>=0.4.0,<0.5.0)",
    "qiskit-machine-learning (>=0.9.0,<0.10.0)",
    "optuna (>=4.8.0,<5.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
